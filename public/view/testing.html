<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Deviation Alert</title>
  </head>

  <body>
    <script>
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);

          const smsMessage = `Attention: Mr. Nabin,

ROUTE DEVIATION ALERT

Your child has deviated from the predefined route.

Please check their current location:
https://yourdomain.com/live-location?lat=${lat}&lon=${lon}

- Child Safety & Route Deviation Detection System`;

          console.log(smsMessage);
        },
        (error) => {
          console.error("Unable to get location:", error);
        },
        {
          enableHighAccuracy: true,
        },
      );
    </script>
  </body>
</html>
